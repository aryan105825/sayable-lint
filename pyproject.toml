[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sayable-lint"
version = "0.1.0"
description = "Voice-readiness linter for Streamable HTTP MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp==1.29.0",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
sayable-lint = "sayable.lint:main"

[tool.setuptools.packages.find]
include = ["sayable*"]
